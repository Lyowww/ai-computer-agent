# Render Blueprint — https://render.com/docs/blueprint-spec
#
# If this service already exists, also set these in the Render Dashboard
# (Blueprint does not always override an existing service's Build/Start):
#   Build Command: npm install
#   Start Command: node ./dist/index.js
# (postinstall compiles TypeScript; index.js starts the HTTP server when run directly)
services:
  - type: web
    name: ai-computer-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node ./dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AI_PROVIDER
        value: openrouter
      - key: AI_MODEL
        value: google/gemini-2.5-flash
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_HTTP_REFERER
        sync: false
      - key: OPENROUTER_APP_NAME
        value: PetAI Computer Agent
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_AGENT_ITERATIONS
        value: "30"
      - key: MAX_SAME_ACTION_RETRIES
        value: "3"
      - key: AI_TIMEOUT_MS
        value: "60000"
      - key: AI_SERVICE_API_KEY
        sync: false
